[build]
  command = "rm -rf .netlify-functions && mkdir -p .netlify-functions && cp analyze-food-v2.js product-lookup.js companion-v1.js compare-photos-v1.js strava-lib.js strava-auth-start.js strava-auth-callback.js strava-activities.js strava-activity-detail.js training-ai-v1.js food-search.js .netlify-functions/"
  functions = ".netlify-functions"
  publish = "."

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"


[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

