[build]
  command = "mkdir -p .netlify-functions && cp analyze-food.js product-lookup.js .netlify-functions/"
  functions = ".netlify-functions"
  publish = "."

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/api/product"
  to = "/.netlify/functions/product-lookup"
  status = 200

[[redirects]]
  from = "/api/analyze-food"
  to = "/.netlify/functions/analyze-food"
  status = 200
