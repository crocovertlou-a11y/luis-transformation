<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>Luis Transformation — Nutrition</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Luis Transformation</p>
      <h1>Nutrition</h1>
    </div>
    <button id="resetDay" class="ghost">Réinitialiser</button>
  </header>

  <main>
    <section class="card summary">
      <div class="summary-head">
        <div>
          <span>Aujourd’hui</span>
          <strong id="dateLabel"></strong>
        </div>
        <div class="kcal"><strong id="kcalValue">0</strong><span>/ 2400 kcal</span></div>
      </div>
      <div class="progress"><div id="kcalBar"></div></div>
      <div class="macros">
        <div><span>Protéines</span><strong id="proteinValue">0 / 170 g</strong></div>
        <div><span>Glucides</span><strong id="carbValue">0 g</strong></div>
        <div><span>Lipides</span><strong id="fatValue">0 g</strong></div>
      </div>
      <p id="proteinHint" class="hint">Il te manque 170 g de protéines.</p>
    </section>

    <section class="card">
      <div class="section-title"><h2>Ajouter un aliment</h2><button id="toggleCustom" class="ghost small">Créer</button></div>
      <input id="searchInput" class="input" placeholder="Rechercher : poulet, skyr, riz…" autocomplete="off" />
      <div id="searchResults" class="results"></div>

      <form id="customForm" class="custom hidden">
        <input class="input" name="name" placeholder="Nom de l’aliment" required />
        <div class="grid4">
          <input class="input" name="kcal" type="number" min="0" placeholder="kcal/100g" required />
          <input class="input" name="protein" type="number" min="0" step="0.1" placeholder="Prot." required />
          <input class="input" name="carbs" type="number" min="0" step="0.1" placeholder="Gluc." required />
          <input class="input" name="fat" type="number" min="0" step="0.1" placeholder="Lip." required />
        </div>
        <button class="primary" type="submit">Enregistrer l’aliment</button>
      </form>
    </section>

    <section id="mealSections"></section>
  </main>

  <dialog id="addDialog">
    <form method="dialog" id="addForm" class="dialog-card">
      <button class="dialog-close" value="cancel">×</button>
      <h3 id="dialogFoodName"></h3>
      <p id="dialogFoodMacros" class="muted"></p>
      <label>Repas
        <select id="mealSelect" class="input">
          <option value="breakfast">Petit-déjeuner</option>
          <option value="lunch">Déjeuner</option>
          <option value="snack">Collation</option>
          <option value="dinner">Dîner</option>
        </select>
      </label>
      <label>Quantité (g)
        <input id="gramsInput" class="input" type="number" min="1" value="100" required />
      </label>
      <button id="confirmAdd" class="primary" value="default">Ajouter</button>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
